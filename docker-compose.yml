services:

  # ========================================
  # MySQL
  # ========================================
  db:
    image: mysql:8.4
    container_name: berem_mysql

    env_file:
      - .env.docker

    ports:
      - "3307:3306"

    volumes:
      - berem_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped


  # ========================================
  # Migrations Prisma
  # ========================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build

    container_name: berem_migrate

    env_file:
      - .env

    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL}

    command: ["pnpm", "db:deploy"]

    depends_on:
      db:
        condition: service_healthy

    restart: "no"


  # ========================================
  # Application Next.js
  # ========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner

    container_name: berem_app

    env_file:
      - .env

    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      PORT: 3000
      HOSTNAME: "0.0.0.0"

    ports:
      - "3000:3000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped


volumes:
  berem_mysql_data: